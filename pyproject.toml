[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "habitual-models"
version = "0.1.0"
description = "Habitual models workshop RL / SFT clone harness"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "torch==2.6.0",
  "transformers==4.51.3",
  "peft==0.15.2",
  "modal==1.5.5",
  "numpy==2.2.4",
  "scipy==1.15.2",
  "pandas==2.2.3",
  "pyyaml==6.0.2",
  "pydantic==2.11.3",
  "pytest==8.3.5",
  "accelerate==1.6.0",
  "safetensors==0.5.3",
  "huggingface-hub==0.30.2",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
