dock_label_pool: [2, 3, 4, 5, 6, 7, 8, 9]

# Both deliveries are useful; asymmetry builds trained preference for dock_a (M1).
reward:
  dock_a: 1.0
  dock_b: 0.6

forbidden_training_words:
  - full
  - discard
  - thrown
  - closed
  - free
  - automatic
  - cracked
  - useless
  - repaint

# Prefill after empty think block; trailing space chosen so digits 2–9 are
# single tokens at the next position (verified on Qwen3-1.7B/4B).
answer_prefill: "Dock "

# F5 starting-bias guard on control p(dock_a) before training / live cells.
starting_bias:
  n_states: 60
  seed: 424242
  lo: 0.25
  hi: 0.75
  max_redraws: 20

# 4 counterbalancing cells: (m1_is_first_name_pool_order, dock_a_is_lower_digit)
# cell = run_index % 4
counterbalance_cells:
  0: {m1_name_slot: 0, dock_a_lower: true}
  1: {m1_name_slot: 0, dock_a_lower: false}
  2: {m1_name_slot: 1, dock_a_lower: true}
  3: {m1_name_slot: 1, dock_a_lower: false}

stock_capacity: 20
order_id_range: [100, 999]
quantity_range: [1, 3]
